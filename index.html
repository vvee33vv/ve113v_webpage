<!-- 鼠标 ★ 星光特效（变小消失版） -->
<script>
(function() {
  // 保持你原来的配色
  var colours = ["#F4F47B", "#9A0D10", "#B0B000"];
  var sparks = [];
  var isAnimating = false;
  var lastSpawn = 0;

  function spawn(x, y) {
    var el = document.createElement("span");
    el.innerText = "★";
    
    // 初始大小可以稍微大一点点，为了缩小过程更明显
    var size = 14 + Math.random() * 14; 
    
    el.style.cssText = 
      "position: fixed;" +
      "left: " + x + "px;" +
      "top: " + y + "px;" +
      "color: " + colours[Math.floor(Math.random() * colours.length)] + ";" +
      "font-size: " + size + "px;" +
      "pointer-events: none;" +
      "z-index: 99999;" +
      "user-select: none;" +
      "transform: translate(-50%, -50%);" +
      "will-change: transform;";
      
    document.body.appendChild(el);

    sparks.push({
      el: el,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 3, 
      vy: Math.random() * 2 + 1,     
      life: 1,                       
      decay: 0.02 + Math.random() * 0.03, // 消散速度
      rot: 0,
      vrot: (Math.random() - 0.5) * 15    
    });

    if (!isAnimating) {
      isAnimating = true;
      requestAnimationFrame(update);
    }
  }

  function update() {
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      
      // 物理更新
      s.x += s.vx;
      s.y += s.vy;
      s.rot += s.vrot;
      s.life -= s.decay;

      // 生命值为 0 时移除
      if (s.life <= 0) {
        if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
        sparks.splice(i, 1);
        continue;
      }

      s.el.style.left = s.x + "px";
      s.el.style.top = s.y + "px";
      // 注意：这里去掉了 opacity，只用 scale 变小，并保留旋转效果
      s.el.style.transform = "translate(-50%, -50%) scale(" + s.life + ") rotate(" + s.rot + "deg)";
    }

    if (sparks.length > 0) {
      requestAnimationFrame(update);
    } else {
      isAnimating = false;
    }
  }

  // 监听鼠标滑动
  document.addEventListener("mousemove", function(e) {
    var now = Date.now();
    if (now - lastSpawn < 30) return; // 节流
    lastSpawn = now;
    spawn(e.clientX, e.clientY);
  });
})();
</script></div>

<div id="Html3" style="position:absolute;left:1979px;top:611px;width:75px;height:61px;z-index:34">
<!-- 自定义图片鼠标指针 -->
<script>
(function() {
  // 防止重复插入
  if (document.getElementById('custom-image-cursor')) return;

  // ==========================================
  // ⚙️ 配置区：只需修改这里即可
  // ==========================================
  var imageUrl = 'images/cursor.png'; // 【必填】你的自定义鼠标图片路径 (支持png/gif/svg)
  var size = 32;                      // 图片显示大小 (px)
  
  // 偏移量：用来校准鼠标的“准心”。
  // 默认设置为图片中心对准鼠标位置 (-50%, -50%)。
  // 如果你的图片是箭头，想让箭头的左上角对准鼠标，请改成 translate(0, 0)。
  var offsetX = '-50%';
  var offsetY = '-50%';
  
  // 顺滑跟随：1 = 完全无延迟（最精准），0.2 = 有一定延迟感（更Q弹）。
  var followSpeed = 0.6; 
  // ==========================================

  // 1. 隐藏系统默认鼠标
  var style= document.createElement('style');
  style.innerHTML = `
    * { cursor: none !important; }
    #custom-image-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: ${size}px;
      height: ${size}px;
      pointer-events: none; /* 确保不阻挡点击 */
      z-index: 2147483647;  /* 保证在最顶层 */
      background-image: url('${imageUrl}');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      will-change: transform, left, top;
    }
    /* 点击时的缩放反馈 */
    #custom-image-cursor.clicking {
      transform: translate(${offsetX}, ${offsetY}) scale(0.85);
    }
    /* 悬停在可点击按钮上时的放大反馈 */
    #custom-image-cursor.hovering {
      transform: translate(${offsetX}, ${offsetY}) scale(1.15);
    }
  `;
  document.head.appendChild(style);

  // 2. 创建自定义鼠标元素
  var cursor = document.createElement('div');
  cursor.id = 'custom-image-cursor';
  // 初始化基础偏移
  cursor.style.transform = `translate(${offsetX}, ${offsetY})`;
  document.body.appendChild(cursor);

  // 3. 鼠标位置追踪
  var mouseX = window.innerWidth / 2;
  var mouseY = window.innerHeight / 2;
  var cursorX = mouseX;
  var cursorY = mouseY;

  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  // 4. 平滑跟随动画
  function render() {
    // 差值平滑计算
    cursorX += (mouseX - cursorX) * followSpeed;
    cursorY += (mouseY - cursorY) * followSpeed;

    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';

    requestAnimationFrame(render);
  }
  render();

  // 5. 交互反馈：鼠标按下 / 松开
  document.addEventListener('mousedown', function() {
    cursor.classList.add('clicking');
  });
  document.addEventListener('mouseup', function() {
    cursor.classList.remove('clicking');
  });

  // 6. 交互反馈：悬停在链接/按钮上
  document.addEventListener('mouseover', function(e) {
    var target = e.target;
    if (target.tagName === 'A' || target.tagName === 'BUTTON' || target.classList.contains('ui-button')) {
      cursor.classList.add('hovering');
    }
  });
  document.addEventListener('mouseout', function(e) {
    var target = e.target;
    if (target.tagName === 'A' || target.tagName === 'BUTTON' || target.classList.contains('ui-button')) {
      cursor.classList.remove('hovering');
    }
  });

})();
</script></div>

<div id="Html8" style="position:absolute;left:1557px;top:616px;width:181px;height:177px;z-index:41">

<!-- 拖拽部件结构 -->
<div id="pin-wrapper">
  <div id="my-drag-pin">
    
    <div id="pin-inner">
      <img id="pin-bg-img" class="pin-bg" src="images/movepin1.png" alt="pin">
      <div class="pin-text">
        <div>★做自我介绍网页</div>
        <div>★睡大觉</div>
        <div>★活着</div>
        <div>★保持活着</div>
      </div>
    </div>
    
  </div>
</div>

<script>
  (function() {
    if (window.__pinDragInitialized) return;
    window.__pinDragInitialized = true;

    var pin = document.getElementById('my-drag-pin');
    var pinInner = document.getElementById('pin-inner');
    var bgImg = document.getElementById('pin-bg-img');
    var isDragging = false;
    var startX, startY;
    
    // 物理摇摆变量
    var angle = 0;          
    var angularVel = 0;     
    var lastX = 0;          
    var targetAngle = 0;    
    
    // 物理参数
    var stiffness = 0.08;    // 弹簧硬度（稍微调软了一点，摇晃更明显）
    var damping = 0.82;      // 阻尼摩擦（越小停得越快）
    var maxAngle = 15;       // 最大倾斜角度
    
    function getPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDrag(e) {
      var pos = getPos(e);
      isDragging = true;
      lastX = pos.x; 

      var rect = pin.getBoundingClientRect();
      pin.style.position = 'fixed';
      pin.style.width = rect.width + 'px';
      pin.style.height = rect.height + 'px';
      pin.style.left = rect.left + 'px';
      pin.style.top = rect.top + 'px';

      startX = pos.x - rect.left;
      startY = pos.y - rect.top;

      bgImg.src = 'images/movepin2.png';
      pin.classList.add('dragging');
      
      // 启动物理渲染循环
      requestAnimationFrame(renderSwing);
      
      if (e.cancelable) e.preventDefault();
    }

    function doDrag(e) {
      if (!isDragging) return;
      var pos = getPos(e);

      // 计算瞬时拖动速度
      var vx = pos.x - lastX;
      lastX = pos.x;

      // 速度映射为目标倾斜角度
      targetAngle = vx * 0.8;
      
      if (targetAngle > maxAngle) targetAngle = maxAngle;
      if (targetAngle < -maxAngle) targetAngle = -maxAngle;

      // 边界限制
      var newLeft = pos.x - startX;
      var newTop = pos.y - startY;
      var winWidth = window.innerWidth;
      var winHeight = window.innerHeight;
      var pinWidth = pin.offsetWidth;
      var pinHeight = pin.offsetHeight;

      if (newLeft < 0) newLeft = 0;
      if (newLeft > winWidth - pinWidth) newLeft = winWidth - pinWidth;
      if (newTop < 0) newTop = 0;
      if (newTop > winHeight - pinHeight) newTop = winHeight - pinHeight;

      pin.style.left = newLeft + 'px';
      pin.style.top = newTop + 'px';

      if (e.cancelable) e.preventDefault();
    }

    function stopDrag() {
      if (!isDragging) return;
      isDragging = false;
      bgImg.src = 'images/movepin1.png';
      pin.classList.remove('dragging');
      targetAngle = 0; 
    }
    
    // 核心：物理弹簧渲染循环
    function renderSwing() {
      // 当完全静止且没有拖拽时，停止循环
      if (!isDragging && Math.abs(angle) < 0.05 && Math.abs(angularVel) < 0.05 && Math.abs(targetAngle) < 0.05) {
        angle = 0;
        pinInner.style.transform = `rotate(0deg)`;
        return;
      }

      // 【核心修复】：让目标角度每帧自动衰减。
      // 这样即使你鼠标按住不动（不触发 doDrag），纸张也会自动回正。
      targetAngle *= 0.85;

      // 弹簧物理公式
      angularVel += (targetAngle - angle) * stiffness;
      angularVel *= damping;
      angle += angularVel;

      pinInner.style.transform = `rotate(${angle}deg)`;

      requestAnimationFrame(renderSwing);
    }

    pin.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', stopDrag);

    pin.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('touchmove', doDrag, { passive: false });
    document.addEventListener('touchend', stopDrag);
    document.addEventListener('touchcancel', stopDrag);
  })();
</script></div>

<!-- 湍流背景动效脚本（完美无重影版） -->
<script>
(function() {
  if (document.getElementById('js-bg-wrapper')) return;

  // 1. 移除 body 原背景，避免干扰
  document.body.style.backgroundImage = 'none';
  document.body.style.backgroundColor = '#FFFFFF';

  // 2. 创建裁剪容器（保证只显示视口内部）
  var wrapper = document.createElement('div');
  wrapper.id = 'js-bg-wrapper';
  wrapper.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -9999; pointer-events: none; overflow: hidden; background-color: #FFF;';

  // 3. 创建滤镜层（向四周外扩 100px 预留形变空间）
  var filterLayer = document.createElement('div');
  // 核心对齐：left:-100px，同时 background-position: 100px，使得图案坐标系与屏幕(0,0)完全重合
  filterLayer.style.cssText = 'position: absolute; left: -100px; top: -100px; width: calc(100% + 200px); height: calc(100% + 200px); ' +
    'background-image: url("images/BG.png"); background-repeat: repeat; background-position: 100px 100px; ' +
    'filter: url(#js-water-flow); -webkit-filter: url(#js-water-flow); will-change: filter;';

  wrapper.appendChild(filterLayer);

  // 4. 动态注入 SVG 滤镜
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.style.cssText = 'position: absolute; width: 0; height: 0; pointer-events: none;';
  
  var defs = document.createElementNS(svgNS, "defs");
  var filter = document.createElementNS(svgNS, "filter");
  // 给滤镜留足计算区域
  filter.setAttribute("id", "js-water-flow");
  filter.setAttribute("x", "-20%");
  filter.setAttribute("y", "-20%");
  filter.setAttribute("width", "140%");
  filter.setAttribute("height", "140%");
  filter.setAttribute("color-interpolation-filters", "sRGB");

  // 生成湍流
  var turbulence = document.createElementNS(svgNS, "feTurbulence");
  turbulence.setAttribute("type", "fractalNoise");
  turbulence.setAttribute("baseFrequency", "0.008 0.012"); // 噪声频率
  turbulence.setAttribute("numOctaves", "2");
  turbulence.setAttribute("seed", "5");
  turbulence.setAttribute("result", "noise");

  var anim1 = document.createElementNS(svgNS, "animate");
  anim1.setAttribute("attributeName", "baseFrequency");
  anim1.setAttribute("dur", "25s");
  anim1.setAttribute("values", "0.008 0.012;0.014 0.008;0.008 0.012");
  anim1.setAttribute("repeatCount", "indefinite");
  turbulence.appendChild(anim1);

  // 施加位移
  var displacement = document.createElementNS(svgNS, "feDisplacementMap");
  displacement.setAttribute("in", "SourceGraphic");
  displacement.setAttribute("in2", "noise");
  displacement.setAttribute("scale", "24"); // 扭曲幅度
  displacement.setAttribute("xChannelSelector", "R");
  displacement.setAttribute("yChannelSelector", "G");
  displacement.setAttribute("result", "displaced");

  var anim2 = document.createElementNS(svgNS, "animate");
  anim2.setAttribute("attributeName", "scale");
  anim2.setAttribute("dur", "18s");
  anim2.setAttribute("values", "16;30;16");
  anim2.setAttribute("repeatCount", "indefinite");
  displacement.appendChild(anim2);

  filter.appendChild(turbulence);
  filter.appendChild(displacement);
  defs.appendChild(filter);
  svg.appendChild(defs);

  // 5. 插入 DOM
  document.body.insertBefore(wrapper, document.body.firstChild);
  document.body.insertBefore(svg, document.body.firstChild);
})();
</script><!-- 禁止图片拖动脚本 -->
<script>
  // 监听全局的 dragstart 事件（也就是开始拖动的瞬间）
  document.addEventListener('dragstart', function(e) {
    // 如果被拖动的元素是图片，就阻止它的默认拖动行为
    if (e.target.tagName === 'IMG') {
      e.preventDefault();
    }
  });
</script><!-- 终极防选中/防拖拽脚本 -->
<script>
  document.addEventListener('selectstart', function(e) {
    // 如果选中的是输入框或文本域，放行；其他一律拦截
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
    }
  });

  document.addEventListener('dragstart', function(e) {
    // 拦截所有图片和文字的拖拽
    e.preventDefault();
  });
  
  // 针对部分浏览器的双击选中拦截
  document.addEventListener('mousedown', function(e) {
    if (e.detail > 1) { // 双击及以上
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    }
  });
</script></body>
